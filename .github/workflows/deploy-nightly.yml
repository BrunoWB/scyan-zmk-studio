name: Deploy Nightly to GitHub Pages

on:
  push:
    branches: [nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (nightly base path)
        run: npm run build
        env:
          VITE_BASE_PATH: /nightly/scyan-zmk-studio/

      - name: Ensure .nojekyll present
        run: touch dist/.nojekyll

      - name: Deploy to brunowb.github.io/nightly/scyan-zmk-studio/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GH_PAT_PAGES }}
          repository-name: BrunoWB/brunowb.github.io
          branch: main
          folder: dist
          target-folder: nightly/scyan-zmk-studio
          clean: false
          commit-message: "chore(nightly): deploy scyan-zmk-studio ${{ github.sha }} [skip ci]"
