name: Deploy Nightly to GitHub Pages

on:
  push:
    branches: [nightly]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (nightly base path)
        run: npm run build
        env:
          VITE_BASE_PATH: /nightly/scyan-zmk-studio/

      - name: Deploy to gh-pages subfolder
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: nightly/scyan-zmk-studio
          # Do NOT wipe the rest of gh-pages (production deploy lives at root)
          clean: false
          commit-message: "chore(nightly): deploy ${{ github.sha }} [skip ci]"
