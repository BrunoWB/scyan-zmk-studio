name: Deploy Nightly to GitHub Pages

on:
  push:
    branches: [nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (nightly base path)
        run: npm run build
        env:
          VITE_BASE_PATH: /nightly/scyan-zmk-studio/

      - name: Ensure .nojekyll present
        run: touch dist/.nojekyll

      - name: Clone brunowb.github.io
        run: |
          git clone --depth=1 \
            "https://x-access-token:${{ secrets.GH_PAT_PAGES }}@github.com/BrunoWB/brunowb.github.io.git" \
            /tmp/user-site

      - name: Sync dist into nightly subfolder
        run: |
          rm -rf /tmp/user-site/nightly/scyan-zmk-studio
          mkdir -p /tmp/user-site/nightly/scyan-zmk-studio
          cp -r dist/. /tmp/user-site/nightly/scyan-zmk-studio/

      - name: Commit and push
        run: |
          cd /tmp/user-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nightly/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(nightly): deploy scyan-zmk-studio ${{ github.sha }} [skip ci]"
          git push origin main
